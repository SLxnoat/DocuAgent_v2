server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → FastAPI backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8030;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── WebSocket proxy → FastAPI backend ────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend:8030;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Static file storage (screenshots, exports) ───────────────────────────
    location /storage/ {
        proxy_pass http://backend:8030;
        proxy_set_header Host $host;
    }

    # ── SPA fallback — all unmatched routes → index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Simple health endpoint for Docker HEALTHCHECK ────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/json application/javascript
                    application/x-javascript text/xml application/xml
                    application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
