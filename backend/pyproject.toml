[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docuagent-backend"
version = "0.1.0"
description = "DocuAgent AI - Live Browser Recording and Multi-Agent Documentation Generator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DocuAgent Team" }
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
